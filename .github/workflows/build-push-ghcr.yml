name: Build & Push Docker Images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (default: the selected branch)"
        required: false
        default: ""

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: vllm-router

jobs:
  # Each architecture builds on a native runner. The Rust release build is far
  # too slow under QEMU emulation, so arm64 uses GitHub's ubuntu-24.04-arm runner.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      ghcr_repository: ${{ steps.image_config.outputs.ghcr_repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image repository config
        id: image_config
        shell: bash
        env:
          GHCR_IMAGE_REPOSITORY_OVERRIDE: ${{ vars.GHCR_IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE_REPOSITORY="${GHCR_IMAGE_REPOSITORY_OVERRIDE:-ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}}"
          echo "ghcr_registry=${GHCR_IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "ghcr_repository=${GHCR_IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image_config.outputs.ghcr_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.router
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image_config.outputs.ghcr_repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=vllm-router-${{ matrix.arch }}
          cache-to: type=gha,scope=vllm-router-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch latest and architecture tags
        env:
          REPOSITORY: ${{ needs.build.outputs.ghcr_repository }}
        run: |
          set -euo pipefail
          AMD64_DIGEST=$(cat /tmp/digests/amd64)
          ARM64_DIGEST=$(cat /tmp/digests/arm64)
          BUILD_TS=$(TZ=Asia/Shanghai date +"%Y%m%d%H%M%S")
          docker buildx imagetools create \
            -t "${REPOSITORY}:latest" \
            -t "${REPOSITORY}:${BUILD_TS}" \
            "${REPOSITORY}@${AMD64_DIGEST}" "${REPOSITORY}@${ARM64_DIGEST}"
          docker buildx imagetools create -t "${REPOSITORY}:${BUILD_TS}.x86_64" "${REPOSITORY}@${AMD64_DIGEST}"
          docker buildx imagetools create -t "${REPOSITORY}:${BUILD_TS}.arm64" "${REPOSITORY}@${ARM64_DIGEST}"
          docker buildx imagetools inspect "${REPOSITORY}:latest"
          {
            echo "### Images pushed"
            echo "- \`${REPOSITORY}:latest\` (amd64 + arm64)"
            echo "- \`${REPOSITORY}:${BUILD_TS}\` (amd64 + arm64)"
            echo "- \`${REPOSITORY}:${BUILD_TS}.x86_64\`"
            echo "- \`${REPOSITORY}:${BUILD_TS}.arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
